name: Build and deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  images:
    name: Build ${{ matrix.service }}
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: control-system-server
            context: ./control-system-server
          - service: web-server
            context: ./web-server
          - service: ai-service
            context: ./ai-service
          - service: tutoring-service
            context: ./tutoring-service
          - service: payment-service
            context: ./payment-service
          - service: portal-read-service
            context: ./portal-read-service
          - service: worker-service
            context: ./worker-service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Contabo VPS
    needs: images
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Load VPS SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      - name: Add VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Sync Compose file
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          scp -P "$VPS_PORT" docker-compose.yml \
            "$VPS_USER@$VPS_HOST:/opt/mas/backend/docker-compose.yml"
      - name: Pull, migrate, and restart release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd /opt/mas/backend && \
             IMAGE_TAG=$RELEASE_SHA docker compose --env-file .deploy.env pull && \
             IMAGE_TAG=$RELEASE_SHA docker compose --env-file .deploy.env run --rm --no-deps control-system-server alembic upgrade head && \
             IMAGE_TAG=$RELEASE_SHA docker compose --env-file .deploy.env up -d --no-build --remove-orphans && \
             docker compose --env-file .deploy.env ps"
