services:
  control-system-server:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/5ylvino/multi-academy-backend}/control-system-server:${IMAGE_TAG:-latest}
    build:
      context: ./control-system-server
    env_file:
      - ./control-system-server/${CONTROL_ENV_FILE:-.env}
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web-server:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/5ylvino/multi-academy-backend}/web-server:${IMAGE_TAG:-latest}
    build:
      context: ./web-server
    env_file:
      - ./web-server/${WEB_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      control-system-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8001/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai-service:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/5ylvino/multi-academy-backend}/ai-service:${IMAGE_TAG:-latest}
    build:
      context: ./ai-service
    env_file:
      - ./ai-service/${AI_ENV_FILE:-.env}
    expose:
      - "8010"
    depends_on:
      web-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  tutoring-service:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/5ylvino/multi-academy-backend}/tutoring-service:${IMAGE_TAG:-latest}
    build:
      context: ./tutoring-service
    env_file:
      - ./tutoring-service/${TUTORING_ENV_FILE:-.env}
    expose:
      - "8011"
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  payment-service:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/5ylvino/multi-academy-backend}/payment-service:${IMAGE_TAG:-latest}
    build:
      context: ./payment-service
    env_file:
      - ./payment-service/${PAYMENT_ENV_FILE:-.env}
    expose:
      - "8012"
    depends_on:
      control-system-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  portal-read-service:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/5ylvino/multi-academy-backend}/portal-read-service:${IMAGE_TAG:-latest}
    build:
      context: ./portal-read-service
    env_file:
      - ./portal-read-service/${PORTAL_READ_ENV_FILE:-.env}
    expose:
      - "8013"
    depends_on:
      web-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker-service:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/5ylvino/multi-academy-backend}/worker-service:${IMAGE_TAG:-latest}
    build:
      context: ./worker-service
    env_file:
      - ./worker-service/${WORKER_ENV_FILE:-.env}
    expose:
      - "8014"
    depends_on:
      web-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8014/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
