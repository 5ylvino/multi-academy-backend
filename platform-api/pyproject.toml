[project]
name = "masms-platform-api"
version = "0.1.0"
description = "Multi-Academy School Management System: single FastAPI server in clean architecture."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.32.1",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "arq>=0.26",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.10",
  "orjson>=3.10",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "aiosmtplib>=3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masms"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N", "C4", "PT", "RET", "TID"]
ignore = ["S101", "B008", "N818", "N811"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/masms/infrastructure/persistence/migrations/**" = ["N999", "E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["masms"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs PostgreSQL and Redis (set TEST_DATABASE_URL and TEST_REDIS_URL)"]
filterwarnings = ["error::DeprecationWarning:masms.*"]

[tool.coverage.run]
source = ["masms"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true

# Clean-architecture layer rules. CI fails on any violation.
[tool.importlinter]
root_package = "masms"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward: presentation > infrastructure > use_cases > domain"
type = "layers"
layers = [
  "masms.presentation",
  "masms.infrastructure",
  "masms.use_cases",
  "masms.domain",
]

[[tool.importlinter.contracts]]
name = "Domain stays free of frameworks"
type = "forbidden"
source_modules = ["masms.domain"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "pydantic", "redis", "arq", "jwt", "argon2", "structlog"]

[[tool.importlinter.contracts]]
name = "Use cases stay free of frameworks"
type = "forbidden"
source_modules = ["masms.use_cases"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "redis", "arq", "jwt", "argon2"]

[[tool.importlinter.contracts]]
name = "Presentation reaches infrastructure only through the container"
type = "forbidden"
source_modules = ["masms.presentation"]
forbidden_modules = [
  "masms.infrastructure.persistence",
  "masms.infrastructure.cache",
  "masms.infrastructure.security",
  "masms.infrastructure.providers",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domain features are independent"
type = "independence"
modules = [
  "masms.domain.identity",
  "masms.domain.tenancy",
  "masms.domain.platform",
  "masms.domain.academics",
  "masms.domain.attendance",
  "masms.domain.finance",
]
