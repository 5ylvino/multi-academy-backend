[project]
name = "multi-academy-ai-service"
version = "0.1.0"
description = "Standalone agentic RAG microservice for Multi-Academy School Management System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary,pool]>=3.2.0",
  "httpx>=0.28.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-community>=0.3.0",
  "langgraph>=0.2.0",
  "pinecone>=5.0.0",
  "boto3>=1.35.0",
  "python-jose[cryptography]>=3.3.0",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "ortools>=9.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
