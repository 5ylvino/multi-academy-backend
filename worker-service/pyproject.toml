[project]
name = "multi-academy-worker-service"
version = "0.1.0"
description = "Async notification and report workers for Multi-Academy SMS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "python-jose[cryptography]>=3.3.0",
  "structlog>=24.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
